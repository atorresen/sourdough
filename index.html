<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sourdough scheduler</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="baguette.ico">
</head>
<body>
    <div id="content">
        
        <div class="top-container">
            <h1>sourdough scheduler</h1>
            <div id="inputs">
                 <p><em>Based on a recipe from</em> <a href="https://www.theperfectloaf.com/sourdough-bread-with-all-purpose-flour/ ">The Perfect Loaf</a></p>

                <p>start time: <input id="startTime" type="time" value="07:00"></p>
                <p>ferment length: 
                    <input class="numberInput" id="fermentInput" type="number" min="3" max="5" step="0.25" value="4">
                    <em>(3–5 hours)</em>
                </p>
                <p>proof length: 
                    <input class="numberInput"  id="proofInput" type="number" min="2" max="4" step="0.25" value="3">
                    <em>(2–4 hours)</em>
                </p>

                <button onclick="display()">calculate</button>
            </div>
        </div>
        
        <hr>

        <div class="container">
            <table>
                <tr><th>feed</th><td id="feed"></td></tr>
                <tr><th>mix</th><td id="mix"></td></tr>
                <tr><th>stretch</th><td id="stretch"></td></tr>
                <tr><th>shape</th><td id="shape"></td></tr>
                <tr><th>proof</th><td id="proof"></td></tr>
                <tr><th>preheat</th><td id="preheat"></td></tr>
                <tr><th>bake</th><td id="bake"></td></tr>
                <tr><th>lid off</th><td id="lidOff"></td></tr>
                <tr><th>cool</th><td id="cool"></td></tr>
            </table>
            <div id="sentences"></div>
        </div>  

        <hr>
    </div>

    <script src="script.js"></script>
</body>
</html>
